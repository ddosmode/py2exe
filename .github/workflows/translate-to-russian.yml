name: Перевод документации и комментариев на русский

on:
  workflow_dispatch:
  push:
    branches: [master, main, develop]
    paths:
      - '**/*.py'
      - '**/*.md'
      - '**/*.rst'
      - '.github/workflows/translate-to-russian.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - '**/*.py'
      - '**/*.md'
      - '**/*.rst'

permissions:
  contents: write

jobs:
  translate:
    name: Перевод docstrings и комментариев
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: |
          pip install --upgrade pip
          pip install openai
          pip install deep_translator

      - name: Перевод файлов
        run: python3 scripts/translate_docs.py .

      - name: Проверка изменений
        id: changes
        run: |
          CHANGES=$(git status --porcelain | wc -l)
          echo "files_changed=$CHANGES" >> $GITHUB_OUTPUT

      - name: Коммит изменений
        if: steps.changes.outputs.files_changed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41894756+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Перевод docstrings и комментариев на русский язык [skip ci]"
          git push
